<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIVORA — From Knowledge to Harvest</title>

<style>

/* =========================
   ОСНОВНІ НАЛАШТУВАННЯ
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7f2;
    color:#183426;
    line-height:1.6;
}

a{
    text-decoration:none;
}

/* =========================
   HEADER
========================= */

header{
    background:#183426;
    color:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 15px rgba(0,0,0,0.15);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-mark{
    width:44px;
    height:44px;
    border:2px solid #d8c98b;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d8c98b;
    font-size:21px;
}

.logo h1{
    font-size:25px;
    letter-spacing:3px;
}

.logo span{
    display:block;
    font-size:9px;
    color:#d8c98b;
    letter-spacing:2px;
}

nav{
    display:flex;
    align-items:center;
}

nav a{
    color:white;
    margin-left:22px;
    font-size:14px;
    transition:0.2s;
}

nav a:hover{
    color:#d8c98b;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:650px;
    background:
        linear-gradient(
            rgba(24,52,38,0.90),
            rgba(24,52,38,0.94)
        );
    color:white;
    padding:100px 7%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hero-content{
    max-width:850px;
}

.hero .symbol{
    width:100px;
    height:100px;
    border:2px solid #d8c98b;
    border-radius:50%;
    margin:0 auto 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    color:#d8c98b;
}

.hero h2{
    font-size:60px;
    letter-spacing:8px;
    margin-bottom:8px;
}

.hero h3{
    color:#d8c98b;
    font-weight:normal;
    font-size:20px;
    margin-bottom:22px;
}

.hero p{
    max-width:720px;
    margin:auto;
    color:#e7eee8;
    font-size:18px;
}

.buttons{
    margin-top:32px;
}

.button{
    display:inline-block;
    padding:14px 28px;
    margin:6px;
    border-radius:7px;
    font-weight:bold;
    transition:0.2s;
}

.button:hover{
    transform:translateY(-2px);
}

.primary{
    background:#d8c98b;
    color:#183426;
}

.secondary{
    border:1px solid #d8c98b;
    color:white;
}

/* =========================
   SECTIONS
========================= */

section{
    padding:80px 7%;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-size:34px;
}

.section-title p{
    color:#68766c;
    margin-top:8px;
}

/* =========================
   CARDS
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:24px;
    max-width:1050px;
    margin:auto;
}

.card{
    background:white;
    border-radius:14px;
    padding:32px;
    box-shadow:0 5px 25px rgba(0,0,0,0.06);
    border:1px solid #e1e6df;
    transition:0.25s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 12px 30px rgba(0,0,0,0.09);
}

.card .icon{
    font-size:38px;
    margin-bottom:15px;
}

.card h3{
    font-size:23px;
    margin-bottom:10px;
}

.card p{
    color:#617067;
}

.card a{
    display:inline-block;
    margin-top:18px;
    color:#183426;
    font-weight:bold;
}

/* =========================
   ABOUT
========================= */

.about{
    background:#e9eee7;
}

.about-box{
    max-width:900px;
    margin:auto;
    text-align:center;
}

.about-box p{
    margin-top:15px;
    color:#536158;
    font-size:17px;
}

/* =========================
   SERVICES
========================= */

.services{
    background:white;
}

.service-list{
    max-width:1050px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.service{
    padding:25px;
    border:1px solid #dfe5dd;
    border-radius:12px;
    background:#fafbf9;
    transition:0.2s;
}

.service:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 25px rgba(0,0,0,0.06);
}

.service h3{
    margin-bottom:9px;
}

.service p{
    color:#68756d;
    font-size:14px;
}

.service a{
    display:inline-block;
    margin-top:15px;
    color:#183426;
    font-weight:bold;
}

/* =========================
   CALCULATOR
========================= */

.calculator{
    max-width:800px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 30px rgba(0,0,0,0.07);
}

.calculator h3{
    font-size:25px;
    margin-bottom:22px;
}

.calculator label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

.calculator input,
.calculator select{
    width:100%;
    padding:13px;
    border:1px solid #d6ded7;
    border-radius:7px;
    font-size:16px;
    background:white;
}

.calc-button{
    width:100%;
    padding:14px;
    margin-top:22px;
    border:0;
    border-radius:7px;
    background:#183426;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.calc-button:hover{
    background:#294f3a;
}

.result{
    margin-top:22px;
    padding:18px;
    border-radius:9px;
    background:#e9eee7;
    display:none;
}

/* =========================
   RESEARCH
========================= */

.research-card{
    max-width:1000px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.research-item{
    background:white;
    padding:25px;
    border-radius:12px;
    border:1px solid #e1e6df;
}

.research-item h3{
    margin-bottom:10px;
}

.research-item p{
    color:#68756d;
    font-size:14px;
}

/* =========================
   QUOTE
========================= */

.quote{
    background:#183426;
    color:white;
    text-align:center;
    padding:85px 7%;
}

.quote p{
    font-size:28px;
    max-width:850px;
    margin:auto;
    font-style:italic;
}

.quote span{
    display:block;
    margin-top:18px;
    color:#d8c98b;
}

/* =========================
   CONTACT
========================= */

.contact{
    background:#f5f7f2;
}

.contact-box{
    max-width:650px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:14px;
    box-shadow:0 5px 25px rgba(0,0,0,0.06);
}

.contact-box input,
.contact-box textarea{
    width:100%;
    padding:13px;
    margin-top:7px;
    margin-bottom:15px;
    border:1px solid #d6ded7;
    border-radius:7px;
    font-family:Arial,sans-serif;
}

.contact-box textarea{
    min-height:130px;
    resize:vertical;
}

.contact-button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:7px;
    background:#183426;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* ======
