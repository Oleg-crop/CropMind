<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIVORA — агрономія від знань до врожаю</title>

<style>
:root{
    --green:#17382a;
    --green2:#24553d;
    --green3:#34704f;
    --gold:#d8c98b;
    --cream:#f4f7f1;
    --white:#ffffff;
    --text:#20362a;
    --muted:#68766d;
    --border:#dfe7df;
    --shadow:0 12px 35px rgba(20,50,35,.09);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--cream);
    color:var(--text);
    line-height:1.6;
}

a{
    color:inherit;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(23,56,42,.97);
    backdrop-filter:blur(10px);
    color:white;
    padding:16px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(216,201,139,.2);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-mark{
    width:44px;
    height:44px;
    border:1.5px solid var(--gold);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-size:21px;
}

.logo h1{
    font-size:24px;
    letter-spacing:4px;
}

.logo span{
    display:block;
    color:var(--gold);
    font-size:9px;
    letter-spacing:1.8px;
}

nav{
    display:flex;
    gap:22px;
}

nav a{
    text-decoration:none;
    color:white;
    font-size:14px;
    opacity:.9;
}

nav a:hover{
    color:var(--gold);
}

/* HERO */

.hero{
    min-height:680px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    padding:90px 6%;
    background:
        radial-gradient(circle at 50% 25%,rgba(75,130,91,.35),transparent 35%),
        linear-gradient(135deg,#10291d,#28553d 65%,#183426);
}

.hero-content{
    max-width:900px;
}

.hero-symbol{
    width:105px;
    height:105px;
    margin:0 auto 28px;
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-size:48px;
    box-shadow:0 0 45px rgba(216,201,139,.12);
}

.hero h2{
    font-size:64px;
    letter-spacing:10px;
    margin-bottom:8px;
}

.hero h3{
    color:var(--gold);
    font-size:21px;
    font-weight:normal;
    margin-bottom:22px;
}

.hero p{
    max-width:720px;
    margin:auto;
    color:#e4ece6;
    font-size:18px;
}

.buttons{
    margin-top:34px;
}

.button{
    display:inline-block;
    padding:14px 28px;
    margin:6px;
    border-radius:7px;
    text-decoration:none;
    font-weight:bold;
    transition:.2s;
}

.button:hover{
    transform:translateY(-2px);
}

.primary{
    background:var(--gold);
    color:var(--green);
}

.secondary{
    border:1px solid var(--gold);
    color:white;
}

/* GENERAL */

section{
    padding:85px 6%;
}

.section-title{
    text-align:center;
    max-width:750px;
    margin:0 auto 45px;
}

.section-title h2{
    font-size:36px;
    color:var(--green);
}

.section-title p{
    margin-top:8px;
    color:var(--muted);
}

/* CARDS */

.cards{
    max-width:1050px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.card{
    background:white;
    padding:32px;
    border-radius:16px;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
}

.icon{
    font-size:38px;
    margin-bottom:15px;
}

.card h3{
    font-size:23px;
    margin-bottom:10px;
    color:var(--green);
}

.card p{
    color:var(--muted);
}

.card-link{
    display:inline-block;
    margin-top:18px;
    color:var(--green);
    font-weight:bold;
    text-decoration:none;
}

/* FARMER */

#farmer{
    background:#f4f7f1;
}

/* STUDENT */

#student{
    background:white;
}

/* RESEARCH */

.research{
    background:#e8eee7;
}

.research-box{
    max-width:950px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.research-item{
    background:white;
    padding:30px;
    border-radius:15px;
    border:1px solid var(--border);
}

.research-item h3{
    color:var(--green);
    margin-bottom:10px;
}

.research-item p{
    color:var(--muted);
}

/* CALCULATOR */

.calculator-section{
    background:linear-gradient(135deg,#edf3ed,#ffffff);
}

.calculator{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:18px;
    padding:35px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
}

.calc-intro{
    text-align:center;
    margin-bottom:30px;
}

.calc-intro h3{
    color:var(--green);
    font-size:27px;
}

.calc-intro p{
    color:var(--muted);
}

.calc-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-weight:bold;
    margin-bottom:7px;
    color:var(--green);
}

.field input,
.field select{
    width:100%;
    padding:13px;
    border:1px solid #ccd8cd;
    border-radius:8px;
    font-size:16px;
    background:#fbfdfb;
    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:var(--green3);
}

.calc-button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:0;
    border-radius:8px;
    background:var(--green);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.calc-button:hover{
    background:var(--green2);
}

.result{
    display:none;
    margin-top:25px;
    padding:24px;
    border-radius:12px;
    background:#edf5ed;
    border:1px solid #cdddcf;
}

.result h3{
    color:var(--green);
    margin-bottom:12px;
}

.result-number{
    font-size:34px;
    font-weight:bold;
    color:var(--green);
}

.result small{
    color:var(--muted);
}

/* SERVICES */

.services{
    background:white;
}

.service-list{
    max-width:1050px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.service{
    padding:28px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#fafcf9;
}

.service-icon{
    font-size:32px;
    margin-bottom:12px;
}

.service h3{
    color:var(--green);
    margin-bottom:8px;
}

.service p{
    color:var(--muted);
    font-size:14px;
}

/* ABOUT */

.about{
    background:var(--green);
    color:white;
    text-align:center;
}

.about-box{
    max-width:850px;
    margin:auto;
}

.about h2{
    color:white;
}

.about p{
    color:#dbe6de;
    font-size:17px;
    margin-top:16px;
}

/* QUOTE */

.quote{
    background:#10261b;
    color:white;
    text-align:center;
    padding:80px 6%;
}

.quote p{
    max-width:800px;
    margin:auto;
    font-size:29px;
    font-style:italic;
}

.quote span{
    display:block;
    margin-top:20px;
    color:var(--gold);
}

    color:#bfcac2;
    text-align:center;
    pad
