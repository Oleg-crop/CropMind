<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIVORA — From Knowledge to Harvest</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f7f2;
    color:#183426;
    line-height:1.6;
}

header{
    background:#183426;
    color:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-mark{
    width:44px;
    height:44px;
    border:2px solid #d8c98b;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#d8c98b;
    font-size:22px;
}

.logo h1{
    font-size:25px;
    letter-spacing:4px;
}

.logo span{
    font-size:9px;
    color:#d8c98b;
    letter-spacing:2px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:14px;
}

nav a:hover{
    color:#d8c98b;
}

.hero{
    background:linear-gradient(135deg,#183426,#315740);
    color:white;
    text-align:center;
    padding:100px 7%;
}

.symbol{
    width:100px;
    height:100px;
    border:2px solid #d8c98b;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 25px;
    font-size:45px;
    color:#d8c98b;
}

.hero h2{
    font-size:60px;
    letter-spacing:8px;
}

.hero h3{
    color:#d8c98b;
    font-weight:normal;
    font-size:20px;
    margin:10px 0 20px;
}

.hero p{
    max-width:750px;
    margin:auto;
    font-size:18px;
    color:#e8eee9;
}

.buttons{
    margin-top:30px;
}

.button{
    display:inline-block;
    padding:14px 27px;
    margin:5px;
    border-radius:7px;
    text-decoration:none;
    font-weight:bold;
}

.primary{
    background:#d8c98b;
    color:#183426;
}

.secondary{
    border:1px solid #d8c98b;
    color:white;
}

section{
    padding:75px 7%;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
}

.section-title h2{
    font-size:34px;
}

.section-title p{
    color:#68766c;
    margin-top:8px;
}

.cards{
    max-width:1050px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:24px;
}

.card{
    background:white;
    padding:30px;
    border-radius:14px;
    border:1px solid #e0e6df;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
}

.icon{
    font-size:38px;
    margin-bottom:12px;
}

.card h3{
    font-size:23px;
    margin-bottom:10px;
}

.card p{
    color:#627067;
}

.card a{
    display:inline-block;
    margin-top:18px;
    color:#183426;
    font-weight:bold;
}

.about{
    background:#e8eee6;
}

.calculator{
    max-width:900px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.calc-tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:30px;
}

.calc-tab{
    padding:14px;
    border:1px solid #d5ddd5;
    background:#f5f7f2;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    color:#183426;
}

.calc-tab.active{
    background:#183426;
    color:white;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #d3ddd5;
    border-radius:7px;
    font-size:16px;
    background:white;
}

.nutrients{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.nutrient{
    background:#f5f7f2;
    padding:15px;
    border-radius:9px;
}

.nutrient strong{
    display:block;
    margin-bottom:7px;
}

.calculate{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:7px;
    background:#183426;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.calculate:hover{
    background:#294f3a;
}

.result{
    display:none;
    margin-top:25px;
    background:#e8eee6;
    border-radius:10px;
    padding:22px;
}

.result h3{
    margin-bottom:15px;
}

.result-line{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #d5ddd5;
}

.result-line:last-child{
    border-bottom:0;
}

.warning{
    margin-top:20px;
    padding:15px;
    background:#fff7df;
    border-radius:8px;
    color:#66551e;
    font-size:14px;
}

.research{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    max-width:1050px;
    margin:auto;
}

.research-item{
    background:white;
    padding:25px;
    border-radius:12px;
    border:1px solid #e0e6df;
}

.research-item h3{
    margin-bottom:10px;
}

.research-item p{
    color:#68756d;
    font-size:14px;
}

.services{
    background:white;
}

.service-list{
    max-width:1050px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.service{
    background:#fafbf9;
    border:1px solid #dfe5dd;
    padding:25px;
    border-radius:12px;
}

.service h3{
    margin-bottom:10px;
}

.service p{
    color:#68756d;
    font-size:14px;
}

.quote{
    background:#183426;
    color:white;
    text-align:center;
}

.quote p{
    max-width:850px;
    margin:auto;
    font-size:28px;
    font-style:italic;
}

.quote span{
    display:block;
    margin-top:18px;
    color:#d8c98b;
}

.contact-box{
    max-width:650px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:14px;
}

.contact-box input,
.contact-box textarea{
    width:100%;
    padding:13px;
    margin:7px 0 15px;
    border:1px solid #d3ddd5;
    border-radius:7px;
}

.contact-box textarea{
    height:130px;
}

.contact-button{
    width:100%;
    padding:14px;
    background:#183426;
    color:white;
    border:0;
    border-radius:7px;
    font-weight:bold;
}

footer{
    background:#10261b;
    color:#cbd5ce;
    text-align:center;
    padding:40px;
}

footer .brand{
    color:white;
    font-size:23px;
    letter-spacing:3px;
}

@media(max-width:700px){

    nav{
        display:none;
    }

    .hero{
        padding:70px 5%;
    }

    .hero h2{
        font-size:40px;
    }

    section{
        padding:55px 5%;
    }

    .cards,
    .research,
    .service-list{
        grid-template-columns:1fr;
    }

    .nutrients{
        grid-template-columns:1fr;
    }

    .calc-tabs{
        grid-template-columns:1fr;
    }

    .calculator{
        padding:22px;
    }

    .quote p{
        font-size:21px;
    }
}

</style>

</head>

<body>


<header>

<div class="logo">

<div class="logo-mark">✦</div>

<div>
<h1>SIVORA</h1>
<span>KNOWLEDGE • FIELD • HARVEST</span>
</div>

</div>

<nav>

<a href="#student">Студенту</a>
